<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>EarnCampus</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <header class="main-header">
    <h1 class="app-title">Earn<span>Campus</span></h1>
  </header>

  <div class="tab-section">
    <button id="needTab" class="tab-button active-tab">I NEED</button>
    <button id="offerTab" class="tab-button">I OFFER</button>
  </div>

  <section class="post-form-section">
    <input type="text" id="postTitle" placeholder="What's on your mind? (e.g., Need a bike)" />
    <textarea id="postDetails" rows="4" placeholder="Describe the task or service in detail..."></textarea>
    <div class="composer-footer">
      <div class="price-input">
        <span>₹</span>
        <input type="number" id="postPrice" placeholder="0.00" />
      </div>
      <button id="postBtn" class="btn-primary">Post Request</button>
    </div>
  </section>

  <div class="feed-section">
    <h2 id="feedHeading">I NEED POSTS</h2>
    <div id="postFeed"></div>
  </div>


  <script src="app.js"></script>
</body>

</html>
