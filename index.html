<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnCampus | Student Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="main-header">
    <div class="header-content">
      <h1 class="app-title">Earn<span>Campus</span></h1>
      <div class="global-filter">
        <label for="hostelSelect">📍 Location:</label>
        <select id="hostelSelect">
          <option value="">All Hostels (Public)</option>
          <option value="H1">Hostel 1</option>
          <option value="H2">Hostel 2</option>
          <option value="H3">Hostel 3</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="tab-section">
      <button id="needTab" class="tab-button active-tab">I NEED HELP</button>
      <button id="offerTab" class="tab-button">I OFFER SERVICE</button>
    </div>

    <section class="post-form-section">
      <div class="form-group">
        <input type="text" id="postTitle" placeholder="Title (e.g., Need a bike for 2 hours)" required>
        <textarea id="postDetails" rows="2" placeholder="Provide more details..."></textarea>
      </div>
      
      <div class="composer-footer">
        <div class="price-input">
          <span>₹</span>
          <input type="number" id="postPrice" placeholder="0" />
        </div>
        <button id="postBtn" class="btn-primary">Post to Feed</button>
      </div>
    </section>

    <div class="feed-section">
      <div class="feed-header">
        <h2 id="feedHeading">I NEED POSTS</h2>
      </div>
      <div id="postFeed"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
